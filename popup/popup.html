<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>素材采集器</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="brand">
      <img class="logo" src="../assets/icons/48.png" alt="">
      <div>
        <div class="name">素材采集器 <span class="ver" id="ver">v1.6.5</span></div>
        <button class="status" id="status" title="点击测试连接">
          <i class="dot"></i><span id="statusText">检测中…</span>
        </button>
      </div>
    </div>
  </header>

  <div class="row3">
    <button class="tile" data-action="region">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
        <path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
      </svg>
      <kbd>Ctrl+2</kbd>
      <span>自定义区域截图</span>
    </button>

    <button class="tile" data-action="viewport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="13" rx="2"/>
        <circle cx="12" cy="12.5" r="3.4"/><path d="M8 3h8"/>
      </svg>
      <kbd>Ctrl+3</kbd>
      <span>可视区域截图</span>
    </button>

    <button class="tile" data-action="fullpage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3" width="14" height="18" rx="2"/>
        <path d="M12 7v8"/><path d="m9 12 3 3 3-3"/>
      </svg>
      <kbd>Ctrl+4</kbd>
      <span>整页滚动截图</span>
    </button>
  </div>

  <div class="row2">
    <button class="mini" id="copyImg" title="把本页最大的那张图以原图字节复制到剪贴板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6a3 3 0 0 0-3 3v6.5A2.5 2.5 0 0 0 5.5 15"/>
      </svg>
      <span>复制原图</span>
    </button>
    <button class="mini" id="openStudio" title="扫描当前保存目录，浏览 / 复制 / 反推提示词">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7.5A2 2 0 0 1 5 5.5h4l2 2.4h8A2 2 0 0 1 21 10v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <path d="M9 13.5h6"/>
      </svg>
      <span>素材工作台</span>
    </button>
  </div>

  <button class="wide" data-action="batch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/>
      <rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
    </svg>
    <kbd>Ctrl+1</kbd>
    <span>批量采集本页图片</span>
  </button>

  <button class="wide" id="pinGrab" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5v10.5"/><path d="m7.6 9.6 4.4 4.4 4.4-4.4"/>
      <path d="M4 17.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5"/>
    </svg>
    <span>采集本页大图（Pinterest 原图）</span>
  </button>

  <div class="row5">
    <button data-link="stats" title="采集统计">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
      </svg>
      <span>采集统计</span>
    </button>
    <button data-link="help" title="使用说明">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 2.4c-.6.2-.9.7-.9 1.3v.4"/>
        <circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
      <span>使用说明</span>
    </button>
    <button data-link="open" title="打开保存位置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7.5A2 2 0 0 1 5 5.5h4l2 2.4h8A2 2 0 0 1 21 10v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <span>保存位置</span>
    </button>
    <button data-link="options" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.87l-.06-.06A2 2 0 1 1 7.07 5.24l.06.06A1.7 1.7 0 0 0 9 5.6V5a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.87 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 20.4 12H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
      <span>设置</span>
    </button>
    <button data-link="about" title="关于">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/>
        <circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
      <span>关于</span>
    </button>
  </div>

  <div class="menu" id="menuBar">
    <span id="menuText">右键菜单：检测中…</span>
    <button type="button" id="menuFix" title="在浏览器里重新注册一次图片右键菜单">重新注册</button>
  </div>

  <div class="hint err" id="lastErr" hidden></div>

  <div class="hint" id="hint">在图片上点右键即可一键剪藏；也可用 Alt+右键</div>
</div>
<script src="popup.js"></script>
</body>
</html>
